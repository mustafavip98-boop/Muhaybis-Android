name: Build Muhaybis Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --org com.muhaybis.app .
      - name: Add network and microphone permissions
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muhaybis-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
